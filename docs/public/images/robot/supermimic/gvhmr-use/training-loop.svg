<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700" role="img" aria-labelledby="title description">
  <title id="title">SuperMimic 的世界模型与策略训练循环</title>
  <desc id="description">当前策略在 MuJoCo 中执行动作，采集的状态、动作和仿真条件进入回放缓冲区。用连续仿真片段更新世界模型。从缓冲区取起始状态，在固定权重的世界模型中交替执行策略和预测下一状态。追踪回报的梯度穿过多步预测更新策略，更新后的策略回到 MuJoCo 采样。</desc>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172b40; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 650; }
      .detail { font-size: 14px; fill: #435a71; }
      .box { fill: #fff; stroke: #afc0ce; stroke-width: 1.4; }
      .flow { fill: none; stroke: #48627b; stroke-width: 2; }
      .gradient { fill: none; stroke: #7a4a9a; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="980" height="700" rx="20" fill="#f9fbfd"/>
  <text x="64" y="49" class="title">SuperMimic 训练循环</text>
  <text x="64" y="76" class="detail">参考动作提供追踪目标，MuJoCo 提供动力学样本</text>

  <rect x="64" y="104" width="858" height="145" rx="15" fill="#eaf3fb"/>
  <text x="86" y="135" class="heading">1. 在 MuJoCo 采样</text>
  <rect x="86" y="155" width="222" height="70" rx="9" class="box"/>
  <text x="197" y="184" text-anchor="middle" class="label">当前策略</text>
  <text x="197" y="207" text-anchor="middle" class="detail">观测和目标 → 关节指令</text>

  <rect x="378" y="155" width="222" height="70" rx="9" class="box"/>
  <text x="489" y="184" text-anchor="middle" class="label">MuJoCo 中的 G1</text>
  <text x="489" y="207" text-anchor="middle" class="detail">执行指令，计算下一状态</text>

  <rect x="670" y="155" width="230" height="70" rx="9" class="box"/>
  <text x="785" y="184" text-anchor="middle" class="label">回放缓冲区</text>
  <text x="785" y="207" text-anchor="middle" class="detail">状态、动作、仿真条件</text>
  <path d="M308 190H374" class="flow"/>
  <path d="M600 190H666" class="flow"/>

  <rect x="64" y="285" width="858" height="133" rx="15" fill="#e6f4ef"/>
  <text x="86" y="316" class="heading">2. 更新世界模型</text>
  <rect x="670" y="335" width="230" height="62" rx="9" class="box"/>
  <text x="785" y="361" text-anchor="middle" class="label">取连续仿真片段</text>
  <text x="785" y="382" text-anchor="middle" class="detail">起点、已执行动作、后续状态</text>
  <rect x="378" y="335" width="222" height="62" rx="9" class="box"/>
  <text x="489" y="361" text-anchor="middle" class="label">预测并和仿真状态比较</text>
  <text x="489" y="382" text-anchor="middle" class="detail">用预测误差更新模型权重</text>
  <path d="M785 225V331" class="flow"/>
  <path d="M670 365H604" class="flow"/>

  <rect x="64" y="466" width="858" height="203" rx="15" fill="#f2eefa"/>
  <text x="86" y="497" class="heading">3. 在世界模型里更新策略</text>
  <text x="900" y="497" text-anchor="end" class="detail">从回放缓冲区抽取起始状态和仿真条件</text>
  <rect x="86" y="525" width="222" height="68" rx="9" class="box"/>
  <text x="197" y="553" text-anchor="middle" class="label">同一个策略生成新动作</text>
  <text x="197" y="575" text-anchor="middle" class="detail">根据当前观测与参考目标</text>
  <rect x="378" y="525" width="222" height="68" rx="9" class="box"/>
  <text x="489" y="553" text-anchor="middle" class="label">世界模型预测下一状态</text>
  <text x="489" y="575" text-anchor="middle" class="detail">本次策略更新固定模型权重</text>
  <rect x="670" y="525" width="230" height="68" rx="9" class="box"/>
  <text x="785" y="553" text-anchor="middle" class="label">计算短程追踪回报</text>
  <text x="785" y="575" text-anchor="middle" class="detail">按预测轨迹与参考动作评分</text>

  <path d="M489 397V521" class="flow"/>
  <path d="M900 190H950V492H907" class="flow"/>
  <path d="M308 554H374" class="flow"/>
  <path d="M600 554H666" class="flow"/>
  <path d="M489 593V619H197V597" class="flow"/>
  <text x="344" y="613" text-anchor="middle" class="detail">下一步观测，继续预测</text>
  <path d="M785 593V645H142V597" class="gradient"/>
  <text x="525" y="638" text-anchor="middle" class="detail">回报梯度穿过多步预测，更新策略</text>

  <path d="M86 559H35V190H82" class="flow"/>
  <text x="29" y="387" transform="rotate(-90 29 387)" text-anchor="middle" class="detail">更新后的策略回到 MuJoCo 采样</text>

  <path fill="#48627b" d="M378 190l-9-4.5v9z M670 190l-9-4.5v9z M785 335l-4.5-9h9z M600 365l9-4.5v9z M489 525l-4.5-9h9z M902 492l9-4.5v9z M378 554l-9-4.5v9z M670 554l-9-4.5v9z M197 593l-4.5 9h9z M86 190l-9-4.5v9z"/>
  <path fill="#7a4a9a" d="M142 593l-4.5 9h9z"/>
</svg>
